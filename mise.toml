[tools]
# Jails generates new projects for JDK 26 (`TARGET_RELEASE`) while preserving
# the configured release of adopted Java 21+ projects. Pin the exact default
# toolchain so strict generated-project tests compile with `--release 26`.
java = "openjdk-26.0.2"
maven = "3.9.16"
mvnd = "1.0.6"
gradle = "8.5"

# The lint half, separately callable because `pre-commit` needs it without the
# suite: a multi-minute pre-commit is one people learn to skip with
# `--no-verify`, which makes it worse than no hook. It is a task rather than a
# line in two places because those two places had already drifted -- the hook
# ran clippy without `-D warnings`, so an unused import passed `pre-commit` and
# failed `pre-push` and CI. Same flags, one definition.
[tasks.lint]
description = "Format and lint exactly as the gate does"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.verify-rewrite]
description = "Run the single mandatory rewrite verification gate"
depends = ["lint"]
# **`cargo build --workspace` used to run here, and it was a barrier, not a
# build.** Everything it produced, the line below produces too: `cargo test
# --workspace` builds every library, every binary -- `target/debug/jails`
# included, which the integration tests spawn some thousands of times -- and
# then the test harnesses on top of them. What running it separately added was
# an ordering constraint. No test harness could start compiling until the last
# library had finished linking, and this workspace is a deep chain (support ->
# java/spec -> protocol -> state -> project -> generate -> ... -> engine ->
# jails), so on four cores both halves spend much of their time with cores idle
# waiting on one crate. Handed to cargo as a single graph it fills those gaps
# with test-harness work for crates already built.
#
# Measured cold with `CARGO_INCREMENTAL=0`, deps cached, every workspace crate
# cleaned: 87.9s + 126.1s = 214.0s split, against 177.7s merged. That was once
# described here as "exactly the state each CI run starts in"; it is not. CI
# runs with incremental *on*, deliberately -- turning it off was tried and cost
# the gate 90-120s of wall clock, which CLAUDE.md records -- so read these two
# figures against each other rather than as the gate's absolute cost. The same shape as CI's own log, where
# the two phases were 82.9s and 124.7s.
#
# `simplify-sol.md`'s G0 names `cargo build --workspace` in the gate. What G0
# asks for is that one command compiles the whole workspace and runs every
# test; this one does both, and a compile error still stops the run at the
# first error, in the same place it did before.
#
# **The suite's thirty-three binaries run concurrently now**, through
# `scripts/run-tests.py`. `cargo test` runs them one after another -- the sum
# of the per-target times was within four seconds of the whole run's wall
# clock -- and on CI `cli` is 202s while the other thirty-two are 74s that
# could have finished inside it.
#
# This was deliberately *not* the gate until now, and the reason it could not
# be is fixed rather than waived: the Maven permit budget was a `Mutex` and a
# `Condvar`, so each binary believed it owned all six permits and thirty-three
# of them oversubscribed the machine. It is a `flock` budget shared across
# processes now (`tests/common/mod.rs`), so the whole run has one budget
# however it is launched.
#
# It is still one answer to "is this green": same binaries from `cargo test
# --no-run`, same filters, same exit status. What it adds is a python3
# dependency for the gate, which is the cost this trade accepts.
#
# **One command, and the Gradle example no longer needs a second.** It used to
# be skipped here and then run by a `cargo test` of its own under
# `mise x java@21 gradle@8.5`, because it read `gradle` and `JAVA_HOME` off the
# ambient environment and the repository default is JDK 26. That second
# invocation ran exactly one test, after everything else had finished: 29.15s
# measured, of which cargo's own freshness check was 0.1s -- so essentially all
# of it was one Gradle build waiting its turn.
#
# `pinned_gradle_toolchain()` locates the pinned pair instead of inheriting it,
# so the test runs inside the ordinary suite where its ~16s overlaps a ~300s
# test phase rather than following it. Running it by hand under `mise x` still
# works: the ambient pair is honoured first.
# **`JAILS_GIT_DIFF_ALGORITHM=` pins the gate to git's own default**, and the
# empty value is the point: it is the one setting every git ever shipped
# supports, so the gate gives one answer on a runner with git 2.55 and on a
# laptop with 2.43.
#
# Without it the gate is not deterministic. `git merge-file` grew
# `--diff-algorithm` after 2.43, so jails asks the machine and uses histogram
# where it can; histogram and myers can resolve an ambiguous three-way merge
# differently, and the merged bytes go into the managed tree and the accepted
# projection. `simplify-sol.md`'s G0 asks for one answer to "is this green",
# and a gate whose merges depend on the distribution underneath it is two
# answers wearing one name.
#
# What this costs is that the gate never exercises the histogram path. That is
# the right trade: which hunks git picks is git's business and is covered by
# its own suite, while the parts that are jails' -- that the probe matches a
# direct invocation, and that the flag lands between the caller's flags and the
# operands -- are unit-tested on whatever git the machine has.
run = [
  "JAILS_GIT_DIFF_ALGORITHM= JAILS_REQUIRE_TOOLCHAIN=1 ./scripts/run-tests.py",
]

[tasks.test]
description = "Run every test binary concurrently, longest first (the fast inner-loop run)"
# Deliberately *not* what `verify-rewrite` invokes. `simplify-sol.md`'s G0 asks
# for one answer to "is this green", so the mandatory gate stays on plain
# `cargo test --workspace` -- the thing CI, the pre-push hook and every other
# Rust project agree on the meaning of. This is the same binaries, the same
# filters and the same exit status, overlapped rather than run end to end,
# for the loop a developer is actually sitting in front of. It needs python3,
# which the gate must not.
run = "./scripts/run-tests.py"

[tasks.verify-rewrite-g1-canary]
description = "Build the frozen legacy revision and compare iterative, rerun, and destroy semantics"
run = "./scripts/verify-rewrite-g1-canary.sh"
