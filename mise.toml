[tools]
# Generated projects declare `--release 26` (`TARGET_RELEASE`); adopted Java 21+
# projects keep their configured release. Pin the exact default toolchain so
# strict generated-project tests compile with the release new projects declare.
java = "openjdk-26.0.2"
maven = "3.9.16"
mvnd = "1.0.6"
gradle = "8.5"

# The lint half, separately callable because `.githooks/pre-commit` needs it
# without the suite: a multi-minute pre-commit is one people learn to skip.
# One definition, so the hook and the gate cannot disagree about "lint-clean".
[tasks.lint]
description = "Format and lint exactly as the gate does"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

# The one answer to "is this green". `.githooks/pre-push` and CI invoke this
# task and nothing else.
#
# `cargo doc -D warnings` is here because the comments carry rustdoc links and
# a link to a moved item is a warning nothing reads otherwise. It is in this
# task rather than `lint` so the pre-commit wait stays short.
#
# `JAILS_TOOLCHAIN=1` switches the real-toolchain tier on and turns a missing
# tool into a failure rather than a skip. `JAILS_GIT_DIFF_ALGORITHM=` pins
# `git merge-file` to git's own default, which every git supports, so the
# merged bytes do not depend on the distribution underneath the gate.
#
# `cargo test --workspace` builds every library, the `jails` binary the
# integration tests spawn, and every harness as one graph; a separate
# `cargo build` would only add an ordering barrier. The binaries run one after
# another; `tests/cli` dominates the run, so concurrency across binaries has
# nothing to win and unbounded memory to lose.
[tasks.verify-rewrite]
description = "Run the single mandatory rewrite verification gate"
depends = ["lint"]
run = [
  "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps",
  "rm -rf target/jails-test-profile",
  "JAILS_GIT_DIFF_ALGORITHM= JAILS_TOOLCHAIN=1 cargo test --workspace; status=$?; ./scripts/subprocess-summary.sh; exit $status",
]

[tasks.test]
description = "The gate's test phase, without the toolchain tier (the inner-loop run)"
run = "cargo test --workspace"
