[tools]
# jails generates projects targeting Java 27 (`TARGET_RELEASE`), but mise's
# java registry carries nothing newer than 26 until JDK 27 GA (2026-09-15).
# We pin a registry version so `mise install` reproduces this toolchain on a
# fresh machine; the earlier `openjdk-27-ea34` pin required a hand-made
# `mise link` and could not.
#
# The real-toolchain integration tests in tests/cli.rs self-skip when javac on
# PATH rejects `--release 27` (see tests/common/mod.rs). Under this pin they
# still run and pass -- verified 143/143 green on openjdk-26.0.2 -- so nothing
# is lost today. Bump to `java = "27"` once GA lands and the registry has it.
java = "openjdk-26.0.2"
maven = "3.9.16"
mvnd = "1.0.6"
