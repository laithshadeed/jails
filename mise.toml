[tools]
# Jails generates new projects for JDK 26 (`TARGET_RELEASE`) while preserving
# the configured release of adopted Java 21+ projects. Pin the exact default
# toolchain so strict generated-project tests compile with `--release 26`.
java = "openjdk-26.0.2"
maven = "3.9.16"
mvnd = "1.0.6"
gradle = "8.5"

# The lint half, separately callable because `pre-commit` needs it without the
# suite: a multi-minute pre-commit is one people learn to skip with
# `--no-verify`, which makes it worse than no hook. It is a task rather than a
# line in two places because those two places had already drifted -- the hook
# ran clippy without `-D warnings`, so an unused import passed `pre-commit` and
# failed `pre-push` and CI. Same flags, one definition.
[tasks.lint]
description = "Format and lint exactly as the gate does"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.verify-rewrite]
description = "Run the single mandatory rewrite verification gate"
depends = ["lint"]
# **`cargo build --workspace` used to run here, and it was a barrier, not a
# build.** Everything it produced, the line below produces too: `cargo test
# --workspace` builds every library, every binary -- `target/debug/jails`
# included, which the integration tests spawn some thousands of times -- and
# then the test harnesses on top of them. What running it separately added was
# an ordering constraint. No test harness could start compiling until the last
# library had finished linking, and this workspace is a deep chain (support ->
# java/spec -> protocol -> state -> project -> generate -> ... -> engine ->
# jails), so on four cores both halves spend much of their time with cores idle
# waiting on one crate. Handed to cargo as a single graph it fills those gaps
# with test-harness work for crates already built.
#
# Measured cold with `CARGO_INCREMENTAL=0`, deps cached, every workspace crate
# cleaned -- which is exactly the state each CI run starts in: 87.9s + 126.1s =
# 214.0s split, against 177.7s merged. The same shape as CI's own log, where
# the two phases were 82.9s and 124.7s.
#
# `simplify-sol.md`'s G0 names `cargo build --workspace` in the gate. What G0
# asks for is that one command compiles the whole workspace and runs every
# test; this one does both, and a compile error still stops the run at the
# first error, in the same place it did before.
run = [
  "JAILS_REQUIRE_TOOLCHAIN=1 cargo test --workspace -- --skip unheld_gradle_example_manifest_builds_on_its_pinned_toolchain",
  "mise x java@21 gradle@8.5 -- env JAILS_REQUIRE_TOOLCHAIN=1 cargo test --test cli unheld_gradle_example_manifest_builds_on_its_pinned_toolchain",
]

[tasks.test]
description = "Run every test binary concurrently, longest first (the fast inner-loop run)"
# Deliberately *not* what `verify-rewrite` invokes. `simplify-sol.md`'s G0 asks
# for one answer to "is this green", so the mandatory gate stays on plain
# `cargo test --workspace` -- the thing CI, the pre-push hook and every other
# Rust project agree on the meaning of. This is the same binaries, the same
# filters and the same exit status, overlapped rather than run end to end,
# for the loop a developer is actually sitting in front of. It needs python3,
# which the gate must not.
run = "./scripts/run-tests.py"

[tasks.verify-rewrite-g1-canary]
description = "Build the frozen legacy revision and compare iterative, rerun, and destroy semantics"
run = "./scripts/verify-rewrite-g1-canary.sh"
