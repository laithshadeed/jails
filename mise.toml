[tools]
# Generated projects declare `--release 26` (`TARGET_RELEASE`); adopted Java 21+
# projects keep their configured release. Pin the exact default toolchain so
# strict generated-project tests compile with the release new projects declare.
java = ["openjdk-26.0.2", "21"]
maven = "3.9.16"
mvnd = "1.0.6"
gradle = "8.5"

[tasks.build]
description = "Build production-ready release binary into dist/jails"
run = "./scripts/build.sh"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.lint]
description = "Format and lint exactly as the gate does"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.check]
description = "Run the quality gate verification suite"
run = "./scripts/run-bounded.sh ./scripts/check.sh"

[tasks.test]
description = "The gate's test phase, running all workspace suites concurrently"
run = "./scripts/run-bounded.sh ./scripts/test.sh"

