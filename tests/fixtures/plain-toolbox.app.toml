# The shared plain toolbox: the ledger control application plus every
# plain-Java kind the shared project proves, as one manifest.
#
# One replay rather than one command per row, deliberately: a manifest row is
# the same `GenerateArgs` `jails g` parses, replayed through the same frontend,
# so what each row proves is unchanged -- and the formatter, which is a Maven
# JVM, runs once over the whole tree instead of once per row. Adding a kind
# here changes what the shared project proves; `tests/cli/main.rs` pins the
# Surefire and Failsafe counts the replay has to produce.
schema = 1
capabilities = ["csv", "json", "sqlite", "testkit", "format", "fake", "http"]

[[generate]]
kind = "value"
name = "Money"
fields = ["amountMinor:long", "currency:string!"]

[[generate]]
kind = "enum"
name = "MatchOutcome"
fields = ["MATCHED", "AMOUNT_DIFFERS", "DATE_DIFFERS", "UNMATCHED"]

[[generate]]
kind = "sealed"
name = "LedgerError"
fields = ["MalformedRow", "UnknownCurrency", "DuplicateReference"]

[[generate]]
kind = "record"
name = "Entry"
fields = ["reference:string!", "postedAt:date", "amount:Money", "memo:string?"]

[[generate]]
kind = "record"
name = "MatchCandidate"
fields = ["sourceEntry:Entry", "targetEntry:Entry"]

[[generate]]
kind = "strategy"
name = "MatchRule"
fields = ["ExactReference", "AmountAndDate", "FuzzyMemo"]
on = "MatchCandidate"
yields = "MatchOutcome"

[[generate]]
kind = "cli"
name = "Ledger"

# `new-cli` writes App.java and `g cli Ledger` writes a second dispatcher, so
# the project has two: name the one this command belongs to rather than
# letting jails guess.
[[generate]]
kind = "command"
name = "Reconcile"
on = "Ledger"

[[generate]]
kind = "class"
name = "MoneyMoved"

[[generate]]
kind = "record"
name = "Tally"
fields = ["hits:int@nonnegative", "total:long@nonnegative"]

[[generate]]
kind = "enum"
name = "Currency"
fields = ["GBP", "EUR"]

[[generate]]
kind = "record"
name = "SourceRef"
fields = ["system:string", "externalId:string"]

[[generate]]
kind = "value"
name = "CanonicalTransaction"
fields = ["id:string!", "date:date", "amountMinor:long", "currency:Currency", "source:SourceRef", "note:string?"]

[[generate]]
kind = "sealed"
name = "Outcome"
fields = ["Accepted", "Rejected"]

[[generate]]
kind = "value"
name = "Stamped"
fields = ["at:string!", "result:Outcome"]

[[generate]]
kind = "record"
name = "Transaction"
fields = ["id:uuid", "amount:long"]

[[generate]]
kind = "record"
name = "Reward"
fields = ["id:uuid", "amount:long"]

[[generate]]
kind = "strategy"
name = "Eligibility"
fields = ["Domestic"]
on = "Transaction"

[[generate]]
kind = "integration-test"
name = "Checkout"
