# Local development services. `jails add` / `jails remove` own the marked
# blocks; `jails run` starts everything here.
services:
  # jails:redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
  # /jails:redis
