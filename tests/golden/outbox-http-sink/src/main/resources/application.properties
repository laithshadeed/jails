spring.persistence.exceptiontranslation.enabled=false
spring.datasource.url=jdbc:postgresql://localhost:5432/app
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.hikari.pool-name=primary
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
# Refuse a read replica now, instead of failing on the first write.
spring.datasource.hikari.connection-init-sql=SELECT 1/(1-pg_is_in_recovery()::int)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# jails starts compose itself (jails run / jails start).
spring.docker.compose.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=demo
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo,com.example.demo.*
spring.kafka.consumer.properties.group.protocol=consumer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
