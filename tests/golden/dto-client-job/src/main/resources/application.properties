# Where `ledger` points. Replace it: `.invalid` can never resolve, and an
# unset base URL fails the first call with `URI with undefined scheme`.
spring.http.serviceclient.ledger.base-url=https://example.invalid
# A stalled dependency holds a request thread until the client gives up, and with
# no timeout that is never. Both halves are needed: connect covers a host that
# does not answer, read covers one that answers and then stops.
spring.http.serviceclient.ledger.connect-timeout=2s
spring.http.serviceclient.ledger.read-timeout=5s
