# Where mail goes. Set explicitly because JavaMail's fallback is
# localhost:25, which fails at the first send rather than at startup.
spring.mail.host=localhost
spring.mail.port=1025
# One From address, set once: a per-call-site literal drifts, and the
# one that drifts is the one a receiving server rejects for failing SPF.
app.mail.from=no-reply@example.com
