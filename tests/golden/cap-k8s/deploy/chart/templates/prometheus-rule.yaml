apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo
spec:
  groups:
    - name: demo.slo
      rules:
        - alert: HttpErrorBudgetFastBurn
          expr: |
            sum(rate(http_server_requests_seconds_count{application="demo",status=~"5.."}[5m]))
              / sum(rate(http_server_requests_seconds_count{application="demo"}[5m])) > 0.05
          for: 5m
          labels:
            severity: page
          annotations:
            summary: HTTP error budget is burning quickly
        - alert: HttpLatencyBudgetBurn
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application="demo"}[10m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: HTTP p99 latency exceeds one second
