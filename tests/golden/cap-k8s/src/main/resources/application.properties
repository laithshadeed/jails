# jails:actuator
management.endpoints.web.exposure.include=health,info,prometheus,threaddump
management.server.port=8081
management.endpoints.web.base-path=/management
management.endpoint.health.cache.time-to-live=5s
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=ping
management.endpoint.health.show-details=when-authorized
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=@project.description@
# /jails:actuator
# jails:observability
management.endpoints.web.exposure.include=health,info,prometheus,threaddump
management.server.port=8081
management.endpoints.web.base-path=/management
management.endpoint.health.cache.time-to-live=5s
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=ping
management.endpoint.health.show-details=when-authorized
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s,10s
management.metrics.distribution.percentiles-histogram.http.server.requests=false
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=0.1
management.tracing.baggage.correlation.fields=request-id
management.tracing.baggage.tag-fields=request-id
management.tracing.baggage.local-fields=request-id
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.buffered=false
management.server.tomcat.accesslog.prefix=stdout
# /jails:observability
# jails:k8s
# Kubernetes supplies POD_NAME from metadata.name; tag every replica separately.
management.metrics.tags.pod.name=${POD_NAME:unknown}
# /jails:k8s
