# The application's own database, inside the project rather than the home
# directory -- two checkouts must not share one file.
spring.datasource.url=jdbc:h2:file:./data/app;AUTO_SERVER=TRUE
# The console is an auto-configuration module, not the driver: without
# spring-boot-h2console on the classpath this property does nothing.
spring.h2.console.enabled=true
# `jails db` opens a SQL prompt on this database and `jails db --web` opens
# H2's own browser console -- both work whether or not the application is up.
# Spring's own console, below, needs the application running.
spring.h2.console.path=/h2-console
# Raw SQL, no ORM -- so no CGLIB proxy around every @Repository.
spring.persistence.exceptiontranslation.enabled=false
