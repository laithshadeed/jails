# Generic Jails application manifest: no crawler-specific core command exists.
schema = 1
capabilities = ["db", "api", "actuator", "observability", "security", "cors", "json", "testkit", "kafka", "docker", "ci"]

[[generate]]
kind = "enum"
name = "CrawlStatus"
fields = ["QUEUED", "RUNNING", "SUCCEEDED", "FAILED", "CANCELLED"]

[[generate]]
kind = "scaffold"
name = "CrawlRun"
fields = ["id:uuid@pk", "seedUrl:uri", "status:CrawlStatus@index", "pagesVisited:long@nonnegative", "startedAt:instant?", "finishedAt:instant?"]
timestamps = true
indexes = ["status, id"]

[[generate]]
kind = "scaffold"
name = "CrawledPage"
fields = ["id:uuid@pk", "crawlRunId:uuid@index", "url:uri", "statusCode:int", "discoveredAt:instant"]
timestamps = true
indexes = ["crawl_run_id, discovered_at desc"]

[[generate]]
kind = "usecase"
name = "QueueCrawl"
fields = ["id:uuid", "seedUrl:uri"]
on = "CrawlRun"

[[generate]]
kind = "usecase"
name = "RecordCrawledPage"
fields = ["id:uuid", "crawlRunId:uuid", "url:uri", "statusCode:int"]
on = "CrawledPage"

[[generate]]
kind = "query"
name = "CrawlRunsByStatus"
fields = ["status:CrawlStatus"]
on = "CrawlRun"

[[generate]]
kind = "query"
name = "PagesByCrawlRun"
fields = ["crawlRunId:uuid"]
on = "CrawledPage"

[[generate]]
kind = "fetcher"
name = "PageFetcher"

[[generate]]
kind = "http-workflow"
name = "SiteTraversal"
on = "PageFetcher"

[[generate]]
kind = "event"
name = "PageDiscovered"
fields = ["id:uuid", "crawlRunId:uuid", "url:uri", "occurredAt:instant"]

[[generate]]
kind = "durable-job"
name = "CrawlDispatcher"
fields = ["id:uuid", "seedUrl:uri"]
on = "QueueCrawl"
yields = "CrawlRun"
