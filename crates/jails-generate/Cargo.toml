[package]
name = "jails-generate"
version.workspace = true
edition.workspace = true

[dependencies]
# `ArtifactKind` is a `ValueEnum` so `clap_complete` can emit a static
# completion list for `generate <TAB>`.
clap.workspace = true
jails-support.workspace = true
jails-java.workspace = true
jails-protocol.workspace = true
jails-spec.workspace = true
jails-project.workspace = true

[lints]
workspace = true

[dev-dependencies]
# `CWD_LOCK`: this crate's tests change the process-global working
# directory, and they share one process.
jails-testkit.workspace = true
tempfile.workspace = true
