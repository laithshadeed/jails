[package]
name = "jails-workspace"
version.workspace = true
edition.workspace = true

[dependencies]
jails-codemod.workspace = true
jails-contracts.workspace = true
jails-model.workspace = true
jails-support.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
jails-compiler.workspace = true
# Self-dependency with the feature on, so the crash suite -- an integration
# test, which links the library built *without* `cfg(test)` -- can reach the
# failpoints. Enabling it here rather than asking every caller to remember
# `--features` keeps `cargo test --workspace` complete.
jails-workspace = { workspace = true, features = ["fault-injection"] }

[features]
# Failpoints exist for the crash suite and are compiled out of a release
# build: an environment-triggered abort in a shipped binary stops a project
# halfway.
fault-injection = []

[lints]
workspace = true
