[package]
name = "jails-project"
version.workspace = true
edition.workspace = true

[dependencies]
# `compose::Runtime` is a `ValueEnum`, same completion rule as `Capability`.
clap.workspace = true
jails-codemod.workspace = true
jails-support.workspace = true
# `ProjectFacts`, `WorkspaceSnapshot` and the captured-file shapes this crate
# produces. Capture and the document adapters sit here so that the one reader
# of `pom.xml` is in the crate that answers "what is this project".
jails-contracts.workspace = true
jails-model.workspace = true
jails-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true

[dev-dependencies]
# `CWD_LOCK`: this crate's tests change the process-global working
# directory, and they share one process.
jails-testkit.workspace = true
tempfile.workspace = true
