[package]
name = "jails-project"
version.workspace = true
edition.workspace = true

[dependencies]
# `compose::Runtime` is a `ValueEnum`, same completion rule as `Capability`.
clap.workspace = true
jails-support.workspace = true
jails-java.workspace = true
jails-protocol.workspace = true
jails-spec.workspace = true
jails-state.workspace = true
# Syntax and source spans only. PostgreSQL semantics stay bounded to migration
# facts the catalog compiler can prove; unsupported DDL becomes an opaque
# blocker instead of being guessed from a permissive parser.
sqlparser.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true

[dev-dependencies]
# `CWD_LOCK`: this crate's tests change the process-global working
# directory, and they share one process.
jails-testkit.workspace = true
tempfile.workspace = true
