[package]
name = "jails-commit"
version.workspace = true
edition.workspace = true

[dependencies]
jails-prepare.workspace = true
jails-project.workspace = true
jails-protocol.workspace = true
jails-support.workspace = true

[dev-dependencies]
# Self-dependency with the feature on, so the crash suite -- an integration
# test, which links the library built *without* `cfg(test)` -- can reach the
# failpoints. Enabling it here rather than asking every caller to remember
# `--features` keeps `cargo test --workspace` complete.
jails-commit = { workspace = true, features = ["fault-injection"] }

[features]
# plan.md §R4.5: failpoints exist for the crash suite and are compiled out
# of a release build. An environment-triggered abort in a shipped binary is a
# way to corrupt somebody's project.
fault-injection = []

[lints]
workspace = true
