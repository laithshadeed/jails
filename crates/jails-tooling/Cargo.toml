[package]
name = "jails-tooling"
version.workspace = true
edition.workspace = true

[dependencies]
# `commands` walks the same `clap::Command` that parses the arguments, so
# there is no second list of what jails can do.
clap = { version = "4.6.4", features = ["derive"] }
jails-support = { path = "../jails-support" }
jails-java = { path = "../jails-java" }
jails-spec = { path = "../jails-spec" }
jails-project = { path = "../jails-project" }
jails-protocol = { path = "../jails-protocol" }
jails-generate = { path = "../jails-generate" }

[lints]
workspace = true
