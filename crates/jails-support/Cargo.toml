[package]
name = "jails-support"
version.workspace = true
edition.workspace = true

[dependencies]
fs2.workspace = true
# The `#[derive(Codec)]` proc macro, a leaf crate with only the three standard
# proc-macro dependencies. `identity` lives here and every one of its values is
# a closed wire format, so the derive has to sit below it.
jails-codec-derive.workspace = true
nix.workspace = true
# Atomic, random, exclusive directory creation and owned cleanup. A normal
# dependency rather than a dev one, because reconciliation needs the guard in
# production.
tempfile.workspace = true

[lints]
workspace = true
