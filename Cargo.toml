[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# One version per external crate, and one path per internal one. Ten manifests
# repeated `clap = { version = "4.6.4", features = ["derive"] }` verbatim, which
# is ten places a version bump has to reach and nine places it can be forgotten
# -- and a workspace that resolves two clap majors compiles, links both, and
# fails only where a derive from one meets a trait from the other.
#
# The per-crate comments justifying *why* a crate takes clap stay in that
# crate's manifest, beside `clap.workspace = true`. They are about that crate's
# reason (a `ValueEnum` for completion), not about the version.
[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.7"
fs2 = "0.4.3"
nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }
tempfile = "3.27"
sqlparser = { version = "0.62.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

jails-codec-derive = { path = "crates/jails-codec-derive" }
jails-codemod = { path = "crates/jails-codemod" }
jails-commit = { path = "crates/jails-commit" }
jails-compiler = { path = "crates/jails-compiler" }
jails-contracts = { path = "crates/jails-contracts" }
jails-drive = { path = "crates/jails-drive" }
jails-generate = { path = "crates/jails-generate" }
jails-java = { path = "crates/jails-java" }
jails-model = { path = "crates/jails-model" }
jails-prepare = { path = "crates/jails-prepare" }
jails-project = { path = "crates/jails-project" }
jails-protocol = { path = "crates/jails-protocol" }
jails-report = { path = "crates/jails-report" }
jails-spec = { path = "crates/jails-spec" }
jails-state = { path = "crates/jails-state" }
jails-support = { path = "crates/jails-support" }
jails-testkit = { path = "crates/jails-testkit" }
jails-workspace = { path = "crates/jails-workspace" }

# One place for the lint policy, so a new crate cannot quietly opt out of it.
[workspace.lints.rust]
# A function nobody calls inside a `mod tests` is almost always a test that
# stopped being one: a `#[test]` lost while moving code between modules leaves
# a plausible-looking function that never runs, and the suite goes green over
# it. That happened while splitting `resource.rs`, and only a warning nobody
# had to read caught it. It is a denial now, so the build stops instead.
dead_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Was "allow", with a comment saying 21 generator functions were waiting on
# plan.md §6's parameter-struct refactor. Re-measured 2026-08-25: nine, four of
# them warning and five carrying a local `#[allow]` -- one of which no longer
# had eight arguments at all. All nine took a parameter object (`Produced`,
# `Subject`, `Request`, `Declared`), so the escape hatch is closed rather than
# left open against a number that had already fallen.
too_many_arguments = "deny"

[package]
name = "jails"
version.workspace = true
edition.workspace = true

[dependencies]
jails-drive.workspace = true
jails-report.workspace = true
jails-commit.workspace = true
jails-prepare.workspace = true
jails-generate.workspace = true
jails-project.workspace = true
jails-spec.workspace = true
jails-java.workspace = true
jails-model.workspace = true
jails-contracts.workspace = true
jails-compiler.workspace = true
jails-workspace.workspace = true
clap.workspace = true
clap_complete = "4.6.7"
jails-protocol.workspace = true
jails-state.workspace = true
jails-support.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
# `CWD_LOCK`: `src/new.rs`'s tests change the process-global working directory.
jails-testkit.workspace = true
# Failpoints, for the crash sweep over a *real* route in `tests/engine.rs`.
# §R4.5's property is about whatever instant a run stops at, and the only way
# to ask it of a whole command is to arm the executor the command uses.
jails-commit = { workspace = true, features = ["fault-injection"] }
# The integration tests assert against jails' own constants -- `TARGET_RELEASE`
# among them -- rather than keeping copies of them in the fixtures.
jails-project.workspace = true
# plan.md §3.2: atomic, random, exclusive scratch creation. A pid plus a
# timestamp is not exclusive -- two threads in one test binary read the same
# nanosecond and got the same directory -- and reimplementing OS randomness
# and Windows deletion semantics is not this project's work.
tempfile.workspace = true
# The toolchain permit gate is shared across *processes*, not just threads,
# because the suite is launched as thirty-three concurrent binaries. `flock`
# is the only budget the kernel releases when a holder dies however it dies.
fs2.workspace = true

[lints]
workspace = true

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Dependencies carry no debug info at all. A panic location inside `clap` or
# `serde` is not a thing anyone here debugs, and every byte of it is linked
# into all thirty-two test binaries and then into the CI cache -- which is
# restored and saved on every run.
[profile.dev.package."*"]
debug = 0
