[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# One version per external crate and one path per internal one. A workspace
# that resolves two clap majors compiles, links both, and fails only where a
# derive from one meets a trait from the other.
[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.7"
fs2 = "0.4.3"
nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }
tempfile = "3.27"
sqlparser = { version = "0.62.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

jails-codemod = { path = "crates/jails-codemod" }
jails-compiler = { path = "crates/jails-compiler" }
jails-contracts = { path = "crates/jails-contracts" }
jails-drive = { path = "crates/jails-drive" }
jails-model = { path = "crates/jails-model" }
jails-project = { path = "crates/jails-project" }
jails-report = { path = "crates/jails-report" }
jails-spec = { path = "crates/jails-spec" }
jails-support = { path = "crates/jails-support" }
jails-testkit = { path = "crates/jails-testkit" }
jails-workspace = { path = "crates/jails-workspace" }

# One place for the lint policy, so a new crate cannot quietly opt out of it.
[workspace.lints.rust]
# A function nobody calls inside a `mod tests` is a test that lost its
# `#[test]`, and the suite goes green over it. Denied so the build stops.
dead_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Every generator takes a parameter object (`Produced`, `Subject`, `Request`,
# `Declared`) rather than eight positional arguments.
too_many_arguments = "deny"

[package]
name = "jails"
version.workspace = true
edition.workspace = true

[dependencies]
jails-drive.workspace = true
jails-report.workspace = true
jails-codemod.workspace = true
jails-project.workspace = true
jails-spec.workspace = true
jails-model = { workspace = true, features = ["cli"] }
jails-contracts.workspace = true
jails-compiler.workspace = true
jails-workspace.workspace = true
clap.workspace = true
clap_complete = "4.6.7"
jails-support.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# `mvn`, memoised, for the real-toolchain tier (`tests/support/mvn.rs`). An
# example rather than a bin so `cargo install --path .` never ships it, and
# `cargo test` still builds it beside the suite.
[[example]]
name = "mvn"
path = "tests/support/mvn.rs"
test = false

[dev-dependencies]
# `CWD_LOCK`: `src/new.rs`'s tests change the process-global working directory.
jails-testkit.workspace = true
# The integration tests assert against jails' own constants -- `TARGET_RELEASE`
# among them -- rather than keeping copies of them in the fixtures.
jails-project.workspace = true
# Atomic, random, exclusive scratch creation: a pid plus a timestamp is not
# exclusive.
tempfile.workspace = true
# The toolchain permit gate is a `flock`: shared across processes, and released
# by the kernel however a holder dies.
fs2.workspace = true

[lints]
workspace = true

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Dependencies carry no debug info: a panic location inside `clap` or `serde`
# is not debugged here, and every byte is linked into every test binary and
# carried in the CI cache.
[profile.dev.package."*"]
debug = 0
