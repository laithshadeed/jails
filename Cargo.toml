[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# One place for the lint policy, so a new crate cannot quietly opt out of it.
[workspace.lints.rust]
# A function nobody calls inside a `mod tests` is almost always a test that
# stopped being one: a `#[test]` lost while moving code between modules leaves
# a plausible-looking function that never runs, and the suite goes green over
# it. That happened while splitting `resource.rs`, and only a warning nobody
# had to read caught it. It is a denial now, so the build stops instead.
dead_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The generator functions genuinely take name/fields/package/pretend/... and
# splitting 21 of them into parameter structs is the refactor in plan.md §6,
# not a prerequisite for having linting on. Revisit when that lands.
too_many_arguments = "allow"

[package]
name = "jails"
version.workspace = true
edition.workspace = true

[dependencies]
jails-tooling = { path = "crates/jails-tooling" }
jails-engine = { path = "crates/jails-engine" }
jails-commit = { path = "crates/jails-commit" }
jails-prepare = { path = "crates/jails-prepare" }
jails-generate = { path = "crates/jails-generate" }
jails-project = { path = "crates/jails-project" }
jails-spec = { path = "crates/jails-spec" }
jails-java = { path = "crates/jails-java" }
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.7"
jails-protocol = { path = "crates/jails-protocol" }
jails-support = { path = "crates/jails-support" }

[dev-dependencies]
# Failpoints, for the crash sweep over a *real* route in `tests/engine.rs`.
# §R4.5's property is about whatever instant a run stops at, and the only way
# to ask it of a whole command is to arm the executor the command uses.
jails-commit = { path = "crates/jails-commit", features = ["fault-injection"] }
# The integration tests assert against jails' own constants -- `TARGET_RELEASE`
# among them -- rather than keeping copies of them in the fixtures.
jails-project = { path = "crates/jails-project" }
# plan.md §3.2: atomic, random, exclusive scratch creation. A pid plus a
# timestamp is not exclusive -- two threads in one test binary read the same
# nanosecond and got the same directory -- and reimplementing OS randomness
# and Windows deletion semantics is not this project's work.
tempfile = "3.27"

[lints]
workspace = true
