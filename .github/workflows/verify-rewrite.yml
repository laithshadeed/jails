# The one gate. `simplify-sol.md` G0: *pre-push and CI invoke only that
# command.*
#
# There is deliberately nothing here but `mise run verify-rewrite`. A workflow
# that spells out its own `cargo test` line is a second answer to "is this
# green", and the second answer is the one that drifts -- which is exactly what
# happened locally: the pre-push hook ran `cargo build && cargo test` with no
# `--workspace`, so it tested the root package alone and said nothing about the
# other twelve crates, and no `JAILS_REQUIRE_TOOLCHAIN`, so every test that
# could not find its toolchain skipped itself and was counted as passing.
#
# The tool list below is not decoration. `JAILS_REQUIRE_TOOLCHAIN=1` turns a
# skip into a failure, so every one of these has to be present or the run is
# red: a JDK that accepts `--release 26`, `jshell`, Maven, mvnd, Gradle 8.5 on
# JDK 21 for the pinned example, git, and a container runtime for the
# Testcontainers suites.
name: verify-rewrite

on:
  # **One event per commit, so there is never a second run to throw away.**
  # A branch with an open pull request fires both `push` and `pull_request`,
  # which is how this job came to run twice against one SHA -- 9m22s and 9m52s
  # on `85597f9`, same commit, same result.
  #
  # Keying `concurrency` on the branch made the later run cancel the earlier
  # one. That stopped the double *billing* and left the double *start*: a run
  # queued, a runner allocated and torn down seconds later, and a cancelled
  # check sitting in the pull request's status list looking to any reader like
  # something failed. Racing a duplicate is not the same as not creating one.
  #
  # Restricting `push` to the default branch removes it at the source. Every
  # branch worked on in this repository has a pull request open --
  # `new-world-compiler-jdl-v1` is PR #1 -- so `pull_request` gates the
  # branches, `push` gates what lands on `main`, and no commit is covered
  # twice. The `pull_request` run is also the better of the two: it builds the
  # branch merged into its base rather than the branch head.
  #
  # What this gives up is CI on a branch with no pull request open, and that is
  # deliberate rather than overlooked. `.githooks/pre-push` runs this exact
  # gate before the push; opening the pull request, draft included, turns the
  # remote one on; `workflow_dispatch` covers a one-off.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede an **older commit's** run when a branch is pushed again while one
# is still going. That run is genuinely obsolete, which is what cancellation is
# for -- as opposed to cancelling a run of the same commit, which is what the
# trigger above now prevents rather than races.
#
# `head_ref || ref_name` rather than `github.ref`: those are different strings
# for the two events (`refs/heads/<branch>` against `refs/pull/<n>/merge`), so
# a group keyed on `github.ref` cannot collapse a branch's runs into one queue.
concurrency:
  group: verify-rewrite-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    # Docker is preinstalled on the GitHub-hosted Ubuntu image, which is what
    # the container-gated tests need. They skip locally on a machine without
    # one; here a skip is a failure.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # **Incremental compilation is build scratch, and on CI it is scratch
    # nobody reads.** Every run is a fresh checkout at a new commit, so the
    # restored `target/debug/incremental` is a previous commit's working state:
    # cargo revalidates it, salvages little, and rewrites it -- and then this
    # job compresses, uploads, downloads and extracts the result forever after.
    # Measured on the tree this gate builds: `target/debug` is 13 GB, of which
    # **4.4 GB is `incremental/`** -- a third of everything the cargo cache
    # carries, for a speedup that only exists between two builds of the *same*
    # source on the *same* machine.
    #
    # It is off here and nowhere else. Locally incremental is worth what it
    # costs -- an ordinary edit rebuilds in about four seconds -- so this is a
    # job-level `env`, not a `.cargo/config.toml` or a `[profile]` key that
    # would follow the setting onto developers' machines.
    #
    # `mise.toml`'s own note already described the gate as running "cold with
    # `CARGO_INCREMENTAL=0` ... which is exactly the state each CI run starts
    # in". That was the intent and never the fact: nothing set it, so every
    # measurement in that comment was taken under a different configuration
    # from the one CI used.
    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4
        with:
          # `verify-rewrite-g1-canary` builds a frozen legacy revision with
          # `git archive`, so a shallow clone would have nothing to freeze.
          fetch-depth: 0

      # Reads `rust-toolchain.toml`, so the compiler CI runs is the compiler
      # the pre-push hook runs and neither can drift from the other. This was
      # `dtolnay/rust-toolchain@stable`, which pins nothing: a clippy release
      # could turn the one gate red over code nobody had touched, and did.
      # `rustup toolchain install` re-downloads five components of 1.94.1 on
      # every run -- the pin in `rust-toolchain.toml` names one exact compiler,
      # so what it fetches is byte-identical each time. Keyed on that file, the
      # entry is written once and read for nothing after; when the pin moves,
      # the key moves with it and the next run pays for one download.
      - name: Cache the pinned Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install the Rust toolchain named by rust-toolchain.toml
        id: rust
        run: |
          rustup toolchain install
          echo "version=$(rustc -V | tr ' /()' '-')" >> "$GITHUB_OUTPUT"
          rustc -V

      # **The compiler has to be in this key, and `rust-toolchain.toml` is why
      # it now is.** A cargo artifact is only valid for the rustc that built
      # it, so the moment the pin named a different compiler from the one that
      # had filled this cache, every restored artifact became garbage that
      # cargo discards on sight. The failure is silent and it is the worst
      # shape available: the key still *hit*, so the step reported success and
      # restored 381 MB, the whole dependency tree recompiled anyway, and
      # `actions/cache` then skipped its save -- because a primary-key hit is
      # exactly when it does -- so nothing could ever repair it. Measured on
      # run `33267456288`: 74 third-party crates compiled where the run before
      # the pin compiled none, clippy 14.7s -> 31.3s and test-harness
      # compilation 179.4s -> 240.5s.
      #
      # With `rustc -V` in the key a compiler change misses honestly, pays for
      # one cold build, and saves artifacts the next run can actually use.
      #
      # **The key also carries the commit, so every run has something to
      # save.** Without that it never did: `actions/cache` skips the save on an
      # exact primary-key hit, and the old key changed only with `Cargo.lock`,
      # so the cache was written once and then frozen at whatever commit
      # happened to fill it.
      # Third-party crates were fine -- they only move when the lock does --
      # but all twenty workspace crates recompiled every run against sources
      # that had moved on, which is 194s of the job. The restore-keys walk
      # back to the newest cache for this compiler and lockfile, so a run
      # starts from its predecessor's artifacts and rebuilds only what the
      # commit actually changed.
      #
      # **The upload this costs was 381 MB when that was measured and is not
      # any more, so re-measure it rather than trusting this paragraph.** On
      # run `33311817728` the save sent **3,703,206,741 bytes** -- 3.7 GB,
      # nearly ten times the figure this comment used to assert, and it had
      # been asserting it for long enough that nobody re-read the log line that
      # prints the real number (`Sent N of N (100.0%)`).
      #
      # What it bought at that size: 50s to restore and 45s to save, 95s of a
      # 479s job -- 20% of the bill -- against the ~134s of compilation the
      # cache saves. A net gain of about 40s, where the same cache at its
      # original size was nearly free. `CARGO_INCREMENTAL=0` at the job level
      # removes the largest single contributor; the entry is expected to be far
      # smaller, and the `du -sh target` in the trim step below prints what it
      # actually is so the next reader has a current number instead of this
      # one.
      #
      # **And it has to save when the gate fails, which is why this is split
      # into restore and save rather than the one `actions/cache` step it was.**
      # That step's automatic post-save is skipped when the job's status is
      # failure, so a red gate writes nothing -- and a gate can stay red across
      # a day of commits. Every one of those runs then restored the last
      # *green* run's entry, so all twenty workspace crates rebuilt against an
      # ever-staler baseline: measured over five consecutive red runs,
      # test-harness compilation sat at 216-231s where a fresh entry costs ~60s,
      # and the trim below never reached a saved entry either, so it stayed at
      # its pre-trim 1889 MB. Red gate -> no save -> staler cache -> slower
      # gate, worse with every commit.
      #
      # A run that compiled everything and then failed a *test* has artifacts
      # as good as a green run's, so the save is guarded on `!cancelled()`
      # rather than `success()`. That is deliberately the opposite of the
      # Maven/Gradle guard below, and the difference is the key: this key
      # carries `github.sha` and its restore-keys walk back, so a poor entry is
      # superseded by the next run, while `jvm-deps` has a static key where one
      # bad write is permanent. `!cancelled()` rather than `always()` keeps the
      # original protection -- a run killed two minutes in must not become the
      # newest entry the restore-keys find.
      - name: Restore cargo
        id: cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      # **Nothing cached the JVM dependency repositories, and a full run fills
      # 296 MB of them.** The cargo cache above covers Rust and `mise-action`
      # covers the tool binaries; neither covers `~/.m2`, which is not on the
      # runner image at all. So every run re-resolved the whole Spring Boot,
      # Testcontainers, Flyway, ArchUnit, JaCoCo and spotless tree from Central
      # before the first generated project could be built. Measured on the
      # suite's own Spring fixture: a cold local repository costs 21.8s for the
      # 44 MB *that one pom* pulls, and it is the smallest of the ~39 Maven
      # invocations this job makes.
      #
      # **The key is static on purpose, and the save is split out so that only
      # a green run can write it.** A static key is written once and read for
      # nothing ever after -- no few-hundred-megabyte upload on the critical
      # path of every run, and no churn evicting the cargo cache beside it.
      # What that costs is a dependency introduced after the cache was written:
      # Maven fetches the delta each run, which is the cheap half and is
      # self-limiting. Bump `v1` when the delta is worth paying once to remove.
      #
      # `actions/cache` would save in its post step whatever the run left
      # behind, pass or fail -- and with a key that never changes, a run that
      # died in clippy would freeze an almost-empty repository in place
      # permanently, turning a cache into a permanent cache miss that looks
      # like a hit. `restore` plus a guarded `save` is what makes the frozen
      # copy a complete one.
      - name: Restore the Maven and Gradle repositories
        id: jvm-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches/modules-2
          key: jvm-deps-${{ runner.os }}-v1

      # Reads `mise.toml`, so the Java, Maven, mvnd and Gradle versions CI runs
      # are the ones the repository pins -- not whatever the image ships.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@v2
        with:
          cache: true

      # `unheld_gradle_example_manifest_builds_on_its_pinned_toolchain` needs
      # Gradle 8.5 on JDK 21 specifically; the default JDK is 26 because that
      # is the release generated projects declare. The task runs that one test
      # under `mise x java@21`, which needs 21 present.
      - name: Install JDK 21 for the pinned Gradle example
        run: mise install java@21

      - name: Show the toolchain the gate will use
        run: |
          rustc --version
          cargo --version
          mise exec -- java -version
          mise exec -- mvn --version | head -1
          mise exec -- gradle --version | grep -E '^Gradle'
          docker --version

      - name: verify-rewrite
        run: mise run verify-rewrite

      # `target/` is cached, and the suite writes things under it that are not
      # build output: `jails-e2e-cache` alone is ~39 MB of generated projects
      # kept between runs, and the logs, cost ledger and permit slots have no
      # meaning on another machine. Dropping them before the post step keeps
      # the cache to artifacts, which is the only part worth carrying.
      #
      # This runs unconditionally: a failed run's artifacts are still valid
      # for the next one, and cargo revalidates everything it restores anyway.
      - name: Trim the cargo cache to build artifacts
        if: always()
        run: |
          rm -rf target/jails-e2e-cache target/jails-test-logs target/jails-test-permits
          # `CARGO_INCREMENTAL=0` above means this run created none. It is
          # still removed, because the entry this run restored was written by a
          # run that predates that setting and the restore-keys walk back to
          # it -- so without this line the 4.4 GB would be carried forward by
          # inheritance, re-uploaded every run, and never rebuilt by anything.
          rm -rf target/debug/incremental
          du -sh target 2>/dev/null || true

      # After the trim, so the entry carries artifacts and not the suite's
      # scratch trees. Skipped only on cancellation -- see the restore step.
      - name: Save cargo
        if: '!cancelled() && steps.cargo.outputs.cache-hit != ''true'''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

      # Only after the gate has passed, and only when there was nothing to
      # restore -- see the restore step for why both conditions are load-bearing.
      - name: Save the Maven and Gradle repositories
        if: success() && steps.jvm-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches/modules-2
          key: jvm-deps-${{ runner.os }}-v1
