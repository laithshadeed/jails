# The one gate: `mise run check` and nothing else, so CI and the
# pre-push hook cannot disagree about what "green" means.
#
# The tool list is load-bearing. `JAILS_TOOLCHAIN=1` turns a missing tool into
# a failure rather than a skip, so every one of these must be present: a JDK
# that accepts `--release 26`, `jshell`, Maven, mvnd, Gradle 8.5 on JDK 21 for
# the pinned example, git, and a container runtime for the Testcontainers
# suites.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Print every subprocess's timing (JAILS_TEST_PROFILE)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: ./scripts/ci-scope.sh --explain >> "$GITHUB_OUTPUT"

      # Align git tracked file mtimes to their respective commit author dates so cargo
      # fingerprint matching succeeds across cached builds without rebuilding unchanged source files.
      - name: Restore file modification timestamps
        run: |
          python3 - <<'EOF'
          import subprocess, os
          proc = subprocess.Popen(['git', 'log', '--pretty=format:COMMIT %ct', '--name-only'], stdout=subprocess.PIPE, text=True)
          seen = set()
          current_time = None
          for line in proc.stdout:
              line = line.strip()
              if not line:
                  continue
              if line.startswith('COMMIT '):
                  current_time = int(line[7:])
              elif line not in seen:
                  seen.add(line)
                  if current_time and os.path.exists(line):
                      try:
                          os.utime(line, (current_time, current_time))
                      except Exception:
                          pass
          proc.wait()
          EOF

      # Pull the container images while the Rust build is still running. The
      # test phase is subprocess-bound, and a registry pull is work that need
      # not be on its clock. The pulls are detached and nothing waits for
      # them; a test that reaches a container first pulls it itself. The list
      # is derived from the tree, because a second copy of a pinned tag
      # drifts silently.
      - name: Warm the container images the suite starts
        run: |
          ./scripts/container-images.sh | while read -r image; do
            nohup docker pull --quiet "$image" >/dev/null 2>&1 &
          done
          disown -a 2>/dev/null || true

      # Reads `rust-toolchain.toml`, so CI runs the compiler the pre-push hook
      # runs. Pinned channel and components with minimal install overhead.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Set rust version output
        id: rust-version
        run: |
          echo "version=$(rustc -V | tr ' /()' '-')" >> "$GITHUB_OUTPUT"
          rustc -V

      # Start installing the fast linker in the background early so it finishes
      # while Rustup, cargo cache, JVM deps and mise are restoring.
      - name: Start installing fast linker
        run: |
          nohup bash -c 'sudo apt-get install -y --no-install-recommends mold || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mold) || sudo apt-get install -y --no-install-recommends lld || true' >/tmp/fast-linker.log 2>&1 &
          disown -a 2>/dev/null || true

      # The key carries the compiler, the lockfile and a hash of the sources.
      # A cargo artifact is valid only for the rustc that built it, so a
      # compiler change must miss. A commit that changes code misses, rebuilds
      # and saves; a commit that changes only documentation hits its own key
      # and skips the save. The restore-keys walk back to the newest entry for
      # this compiler and lockfile, so a run starts from its predecessor's
      # artifacts and rebuilds only what the commit changed.
      #
      # Restore and save are split so a run that compiled everything and then
      # failed a test still saves: its artifacts are as good as a green run's.
      # The save is guarded on `!cancelled()` rather than `always()` so a run
      # killed two minutes in cannot become the newest entry.
      - name: Restore cargo
        id: cargo
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v4-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('src/**', 'crates/**', 'tests/**', 'templates/**', '**/Cargo.toml') }}
          restore-keys: |
            cargo-v4-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            cargo-v4-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-

      # The Maven and Gradle repositories are on neither the runner image nor
      # the cargo cache. The key is static on purpose: written once by a green
      # run and read for nothing after, with no upload on the critical path.
      # Maven fetches the delta for dependencies added since; bump the version
      # when that delta is worth paying once to remove. The save is split out
      # and guarded on success, because a static key written by a run that
      # died early would freeze an almost-empty repository in place forever.
      - name: Restore the Maven and Gradle repositories
        id: jvm-deps
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: jvm-deps-${{ runner.os }}-v3

      # Reads `mise.toml`, so CI runs the versions the repository pins.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      # `unheld_gradle_example_manifest_builds_on_its_pinned_toolchain` needs
      # Gradle 8.5 on JDK 21, which it locates through `mise which java@21`.
      - name: Install JDK 21 for the pinned Gradle example
        run: mise install java@21

      - name: Configure fast linker
        run: |
          for i in $(seq 1 30); do
            if ! pgrep -f apt-get >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if command -v mold >/dev/null 2>&1; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
          elif command -v ld.lld >/dev/null 2>&1 || command -v lld >/dev/null 2>&1; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
          fi

      - name: Show the toolchain the gate will use
        run: |
          rustc --version
          cargo --version
          echo "RUSTFLAGS: ${RUSTFLAGS:-default}"
          mise exec -- java -version
          mise exec -- mvn --version | head -1
          mise exec -- gradle --version | grep -E '^Gradle'
          docker --version

      - name: Run Quality Gate
        run: mise run check
        env:
          JAILS_TEST_PROFILE: ${{ inputs.profile && '1' || '' }}

      # `target/` is cached, and the suite writes scratch under it that has no
      # meaning on another machine; drop it so the entry carries artifacts only.
      # Proof cache is explicitly preserved so proven toolchain executions replay.
      - name: Trim the cargo cache to build artifacts
        if: always()
        run: |
          rm -rf target/jails-e2e-cache target/jails-test-logs target/jails-test-permits \
            target/jails-test-profile target/check-logs
          python3 - <<'DEPS'
          import collections
          from pathlib import Path

          ROOTS = [Path("target/debug"), Path("target/lint/debug"), Path("target/doc-check/debug")]
          for build in ROOTS:
              root = build / "deps"
              # Only prune superseded test/example executables (empty suffix) and their dep-info (.d).
              # Library crates (.rlib) and compiler/lint metadata (.rmeta) must be preserved intact
              # so cargo never recompiles unchanged packages across cached runs.
              files = [p for p in root.iterdir() if p.is_file() and p.suffix in ("", ".d")] if root.is_dir() else []
              before = sum(p.stat().st_size for p in files)
              newest = collections.defaultdict(list)
              for path in files:
                  stem = path.stem.rsplit("-", 1)[0]
                  newest[(stem, path.suffix)].append(path)
              removed = 0
              for group in newest.values():
                  group.sort(key=lambda p: p.stat().st_mtime)
                  for stale in group[:-1]:
                      removed += 1
                      stale.unlink(missing_ok=True)
              after = sum(p.stat().st_size for p in root.iterdir() if p.is_file() and p.suffix in ("", ".d")) if root.is_dir() else 0
              print(
                  f"trim: dropped {removed} superseded test binaries, "
                  f"{before / 1e6:.0f} MB -> {after / 1e6:.0f} MB"
              )
          DEPS
          # Incremental compilation is disabled in CI (CARGO_INCREMENTAL: 0).
          # Drop incremental session trees and uncompressed registry sources to keep
          # the cargo cache archive compact (~300MB instead of ~3GB).
          rm -rf target/debug/incremental target/lint/debug/incremental target/doc-check/debug/incremental
          rm -rf ~/.cargo/registry/src

      # After the trim, so the entry carries artifacts and not the suite's
      # scratch trees. Skipped only on cancellation -- see the restore step.
      - name: Save cargo
        if: '!cancelled() && steps.cargo.outputs.cache-hit != ''true'''
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v4-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('src/**', 'crates/**', 'tests/**', 'templates/**', '**/Cargo.toml') }}

      # Only after the gate has passed, and only when there was nothing to
      # restore -- see the restore step for why both conditions are load-bearing.
      - name: Save the Maven and Gradle repositories
        if: success() && steps.jvm-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: jvm-deps-${{ runner.os }}-v3
