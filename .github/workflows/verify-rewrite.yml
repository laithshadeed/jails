# The one gate. `simplify-sol.md` G0: *pre-push and CI invoke only that
# command.*
#
# There is deliberately nothing here but `mise run verify-rewrite`. A workflow
# that spells out its own `cargo test` line is a second answer to "is this
# green", and the second answer is the one that drifts -- which is exactly what
# happened locally: the pre-push hook ran `cargo build && cargo test` with no
# `--workspace`, so it tested the root package alone and said nothing about the
# other twelve crates, and no `JAILS_REQUIRE_TOOLCHAIN`, so every test that
# could not find its toolchain skipped itself and was counted as passing.
#
# The tool list below is not decoration. `JAILS_REQUIRE_TOOLCHAIN=1` turns a
# skip into a failure, so every one of these has to be present or the run is
# red: a JDK that accepts `--release 26`, `jshell`, Maven, mvnd, Gradle 8.5 on
# JDK 21 for the pinned example, git, and a container runtime for the
# Testcontainers suites.
name: verify-rewrite

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# **One run per commit, not two.** `github.ref` is a different string for the
# two events that both fire on a pull request branch -- `refs/heads/<branch>`
# for the push and `refs/pull/<n>/merge` for the pull_request -- so this keyed
# two groups, `cancel-in-progress` never had anything to cancel, and every
# push to a PR branch ran the whole ten-minute gate twice against the same
# SHA. Both runs on `85597f9` are the evidence: 9m22s under `push` and 9m52s
# under `pull_request`, same commit, same result.
#
# `head_ref || ref_name` is the same string for both: `head_ref` is the source
# branch and is set only on a pull_request, `ref_name` is the bare branch name
# on a push. So the two collapse into one group and one cancels the other.
#
# **The pull_request run is the one that survives, and that is the one worth
# keeping.** The push event fires two to three seconds first every time, so
# the later pull_request run is the canceller. It builds the merge of the
# branch into its base rather than the branch head -- identical trees while
# the base is an ancestor, and strictly more informative once the base has
# moved on.
#
# `push: branches: ["**"]` stays. Branches here are worked on directly and
# merged without a pull request of their own -- `new-world-compiler-jdl-v1`
# is one -- so narrowing the push trigger to `main` would leave them with no
# gate at all, which is a larger hole than a duplicated run was a cost.
concurrency:
  group: verify-rewrite-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    # Docker is preinstalled on the GitHub-hosted Ubuntu image, which is what
    # the container-gated tests need. They skip locally on a machine without
    # one; here a skip is a failure.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # `verify-rewrite-g1-canary` builds a frozen legacy revision with
          # `git archive`, so a shallow clone would have nothing to freeze.
          fetch-depth: 0

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Reads `mise.toml`, so the Java, Maven, mvnd and Gradle versions CI runs
      # are the ones the repository pins -- not whatever the image ships.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@v2
        with:
          cache: true

      # `unheld_gradle_example_manifest_builds_on_its_pinned_toolchain` needs
      # Gradle 8.5 on JDK 21 specifically; the default JDK is 26 because that
      # is the release generated projects declare. The task runs that one test
      # under `mise x java@21`, which needs 21 present.
      - name: Install JDK 21 for the pinned Gradle example
        run: mise install java@21

      - name: Show the toolchain the gate will use
        run: |
          rustc --version
          cargo --version
          mise exec -- java -version
          mise exec -- mvn --version | head -1
          mise exec -- gradle --version | grep -E '^Gradle'
          docker --version

      - name: verify-rewrite
        run: mise run verify-rewrite
