# G1's differential half, on a schedule.
#
# `verify-rewrite` runs on every push and compares nothing against the legacy
# implementation: `subjects_with_fixture` and `adopted_subjects` each return a
# single canonical subject, and the one test that takes a second binary reads
# `JAILS_LEGACY_BIN`, which only this canary sets. So without this workflow the
# differential claim rested on a script nobody was running -- which is how the
# canary came to be naming a cargo test target that had been renamed months
# earlier, and nothing said so. The architecture suite reads this file for
# exactly that: a scheduled job is read by nobody until it has already not run.
#
# **Weekly, and deliberately not per push.** The canary builds a frozen
# revision of the whole binary into its own `CARGO_TARGET_DIR`, so it cannot
# reuse the gate's cache and pays a cold compile every time. The budget
# `docs/40-gates-and-ci.md` sets is for the per-commit `verify` job; this one
# is billed once a week against a claim that would otherwise be untested.
name: verify-rewrite-g1-canary

on:
  schedule:
    # Monday 04:00 UTC, well clear of the working day the results are read in.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      revision:
        description: >-
          The frozen revision to compare against. Defaults to the branch point
          against main; the script refuses a revision that resolves to HEAD,
          which would compare the binary under test with itself.
        required: false
        type: string

# One canary at a time. The persistent toolchain fixtures under
# `target/jails-e2e-cache` are claimed with `flock` per label, so a second run
# is correct either way -- it just builds its own copies from cold, and paying
# that twice for a scheduled job buys nothing.
concurrency:
  group: verify-rewrite-g1-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    # The gate's own job is budgeted at five minutes; this one compiles a
    # second whole binary before it starts testing, so it gets the room.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # The script freezes the legacy revision with `git archive` and finds
          # it with `git merge-base HEAD origin/main`, so a shallow clone has
          # neither the branch point nor the tree to archive.
          fetch-depth: 0

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: canary-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: canary-${{ runner.os }}-

      # Reads `mise.toml`, so the Java, Maven, mvnd and Gradle versions this
      # runs are the ones the repository pins. The canary sets
      # `JAILS_TOOLCHAIN=1`, so a missing tool is a failure naming it
      # rather than a skip reported as a comparison.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install JDK 21 for the pinned Gradle example
        run: mise install java@21

      - name: verify-rewrite-g1-canary
        env:
          JAILS_LEGACY_REVISION: ${{ inputs.revision }}
        run: mise exec -- ./scripts/verify-rewrite-g1-canary.sh
