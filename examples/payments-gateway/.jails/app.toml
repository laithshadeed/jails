# A payments gateway expressed with the same generic intents as the crawler
# and the support inbox. There is no payment, merchant or settlement branch in
# Jails core, and there must not be one: money is `amountMinor:long` plus a
# currency string, idempotency is a unique column, and settlement is a durable
# job over an outbox.
schema = 1
capabilities = ["db", "api", "actuator", "observability", "security", "cors", "json", "testkit", "kafka", "docker", "ci"]

[[generate]]
kind = "enum"
name = "PaymentStatus"
fields = ["AUTHORISED", "CAPTURED", "REFUNDED", "REVERSED", "DECLINED", "FAILED"]

[[generate]]
kind = "enum"
name = "PaymentMethod"
fields = ["CARD", "BANK_TRANSFER", "WALLET"]

[[generate]]
kind = "scaffold"
name = "Merchant"
fields = ["id:uuid@pk@scope", "reference:string!@unique", "displayName:string!"]
timestamps = true

[[generate]]
kind = "scaffold"
name = "Payment"
fields = ["id:uuid@pk", "merchantId:uuid@index@scope", "idempotencyKey:string!@unique", "amountMinor:long@positive", "currency:string!", "method:PaymentMethod", "status:PaymentStatus@index", "version:long@nonnegative", "authorisedAt:instant?", "capturedAt:instant?"]
timestamps = true
indexes = ["merchant_id, created_at desc", "status, created_at"]

[[generate]]
kind = "scaffold"
name = "Refund"
fields = ["id:uuid@pk", "merchantId:uuid@index@scope", "paymentId:uuid@index", "amountMinor:long@positive", "reason:string?"]
timestamps = true
indexes = ["payment_id, created_at"]

# Ownership that the HTTP scope check cannot prove: a payment's merchant, and
# a refund's payment, enforced in PostgreSQL rather than trusted from a claim.
[[generate]]
kind = "association"
name = "PaymentMerchant"
fields = ["merchantId=id"]
strategy_on = "Payment"
strategy_yields = "Merchant"

[[generate]]
kind = "association"
name = "RefundPayment"
fields = ["paymentId=id"]
strategy_on = "Refund"
strategy_yields = "Payment"

# Declared before the use case that yields it: intents run in manifest order.
[[generate]]
kind = "event"
name = "PaymentAuthorised"
fields = ["id:uuid", "merchantId:uuid", "paymentId:uuid", "occurredAt:instant"]

[[generate]]
kind = "usecase"
name = "AuthorisePayment"
fields = ["id:uuid", "merchantId:uuid@scope", "idempotencyKey:string!", "amountMinor:long", "currency:string!", "method:PaymentMethod"]
strategy_on = "Payment"
strategy_yields = "PaymentAuthorised"

[[generate]]
kind = "transition"
name = "CapturePayment"
fields = ["id:uuid", "merchantId:uuid@scope", "status:PaymentStatus", "version:long@nonnegative"]
strategy_on = "Payment"

[[generate]]
kind = "usecase"
name = "RefundPaymentRequest"
fields = ["id:uuid", "merchantId:uuid@scope", "paymentId:uuid", "amountMinor:long"]
strategy_on = "Refund"

[[generate]]
kind = "query"
name = "PaymentsByMerchant"
fields = ["merchantId:uuid@scope"]
strategy_on = "Payment"

[[generate]]
kind = "query"
name = "PaymentsByStatus"
fields = ["merchantId:uuid@scope", "status:PaymentStatus"]
strategy_on = "Payment"

[[generate]]
kind = "fetcher"
name = "AcquirerFetcher"

[[generate]]
kind = "http-sink"
name = "AcquirerSettlement"
strategy_on = "AuthorisePayment"
strategy_yields = "PaymentAuthorised"

# Durable work carries the command it will invoke, so its fields are that
# command's, in order. Jails refuses anything else rather than storing a
# payload it cannot replay -- and it cannot derive them for you, because the
# `@scope` markers that make the work tenant-safe do not survive into the
# generated record.
[[generate]]
kind = "durable-job"
name = "SettlementDispatcher"
fields = ["id:uuid", "merchantId:uuid@scope", "idempotencyKey:string!", "amountMinor:long", "currency:string!", "method:PaymentMethod"]
strategy_on = "AuthorisePayment"
strategy_yields = "Payment"
