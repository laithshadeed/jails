# An Intercom-shaped support inbox expressed with the same generic intents.
schema = 1
capabilities = ["db", "api", "actuator", "observability", "security", "cors", "json", "testkit", "kafka", "docker", "ci"]

[[generate]]
kind = "enum"
name = "ConversationStatus"
fields = ["OPEN", "PENDING", "CLOSED"]

[[generate]]
kind = "enum"
name = "MessageDirection"
fields = ["INBOUND", "OUTBOUND"]

[[generate]]
kind = "enum"
name = "MemberRole"
fields = ["OWNER", "ADMIN", "AGENT"]

[[generate]]
kind = "enum"
name = "InboxChannel"
fields = ["WEB", "EMAIL"]

[[generate]]
kind = "enum"
name = "AssignmentStatus"
fields = ["ACTIVE", "CLEARED"]

[[generate]]
kind = "scaffold"
name = "Workspace"
fields = ["id:uuid@pk@scope", "name:string!@unique"]
timestamps = true

[[generate]]
kind = "scaffold"
name = "Member"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "email:string!", "displayName:string!", "role:MemberRole@index"]
timestamps = true
indexes = ["workspace_id, email"]
unique = ["workspaceId, id"]

[[generate]]
kind = "scaffold"
name = "Inbox"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "name:string!", "channel:InboxChannel@index"]
timestamps = true
indexes = ["workspace_id, name"]
unique = ["workspaceId, id"]

[[generate]]
kind = "scaffold"
name = "InboxMember"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "inboxId:uuid@index", "memberId:uuid@index"]
timestamps = true
indexes = ["workspace_id, inbox_id", "workspace_id, member_id"]

[[generate]]
kind = "scaffold"
name = "Contact"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "email:string!", "displayName:string?"]
timestamps = true
indexes = ["workspace_id, email"]
unique = ["workspaceId, id"]

[[generate]]
kind = "scaffold"
name = "Conversation"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "contactId:uuid@index", "inboxId:uuid@index", "status:ConversationStatus@default(OPEN)@index", "lastMessageAt:instant@default(now())", "version:long@default(0)@nonnegative"]
timestamps = true
indexes = ["workspace_id, status, last_message_at desc"]
unique = ["workspaceId, id"]

[[generate]]
kind = "scaffold"
name = "Message"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "conversationId:uuid@index", "direction:MessageDirection", "body:text!"]
timestamps = true
indexes = ["conversation_id, created_at"]

[[generate]]
kind = "scaffold"
name = "ConversationAssignment"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "conversationId:uuid@unique@index", "memberId:uuid@index", "status:AssignmentStatus@default(ACTIVE)@index", "version:long@default(0)@nonnegative", "assignedAt:instant@default(now())"]
timestamps = true
indexes = ["workspace_id, member_id, status"]

# Explicit persisted ownership chains. These are generic composite relational
# invariants: the HTTP scope check cannot make a contact from another workspace
# belong to this conversation, nor a conversation from another workspace own
# this message.
[[generate]]
kind = "association"
name = "ContactWorkspace"
fields = ["workspaceId=id"]
on = "Contact"
yields = "Workspace"

[[generate]]
kind = "association"
name = "MemberWorkspace"
fields = ["workspaceId=id"]
on = "Member"
yields = "Workspace"

[[generate]]
kind = "association"
name = "InboxWorkspace"
fields = ["workspaceId=id"]
on = "Inbox"
yields = "Workspace"

[[generate]]
kind = "association"
name = "ConversationContact"
fields = ["workspaceId=workspaceId", "contactId=id"]
on = "Conversation"
yields = "Contact"

[[generate]]
kind = "association"
name = "ConversationInbox"
fields = ["workspaceId=workspaceId", "inboxId=id"]
on = "Conversation"
yields = "Inbox"

[[generate]]
kind = "association"
name = "InboxMemberInbox"
fields = ["workspaceId=workspaceId", "inboxId=id"]
on = "InboxMember"
yields = "Inbox"

[[generate]]
kind = "association"
name = "InboxMemberMember"
fields = ["workspaceId=workspaceId", "memberId=id"]
on = "InboxMember"
yields = "Member"

[[generate]]
kind = "association"
name = "MessageConversation"
fields = ["workspaceId=workspaceId", "conversationId=id"]
on = "Message"
yields = "Conversation"

[[generate]]
kind = "association"
name = "AssignmentConversation"
fields = ["workspaceId=workspaceId", "conversationId=id"]
on = "ConversationAssignment"
yields = "Conversation"

[[generate]]
kind = "association"
name = "AssignmentMember"
fields = ["workspaceId=workspaceId", "memberId=id"]
on = "ConversationAssignment"
yields = "Member"

[[generate]]
kind = "usecase"
name = "CreateWorkspace"
fields = ["id:uuid@scope", "name:string!"]
on = "Workspace"

[[generate]]
kind = "usecase"
name = "CreateMember"
fields = ["id:uuid", "workspaceId:uuid@scope", "email:string!", "displayName:string!", "role:MemberRole"]
on = "Member"

[[generate]]
kind = "usecase"
name = "CreateInbox"
fields = ["id:uuid", "workspaceId:uuid@scope", "name:string!", "channel:InboxChannel"]
on = "Inbox"

[[generate]]
kind = "usecase"
name = "AddInboxMember"
fields = ["id:uuid", "workspaceId:uuid@scope", "inboxId:uuid", "memberId:uuid"]
on = "InboxMember"

[[generate]]
kind = "usecase"
name = "CreateContact"
fields = ["id:uuid", "workspaceId:uuid@scope", "email:string!", "displayName:string?"]
on = "Contact"

[[generate]]
kind = "usecase"
name = "OpenConversation"
fields = ["id:uuid", "workspaceId:uuid@scope", "contactId:uuid", "inboxId:uuid"]
on = "Conversation"

[[generate]]
kind = "usecase"
name = "AssignConversation"
fields = ["id:uuid", "workspaceId:uuid@scope", "conversationId:uuid", "memberId:uuid"]
on = "ConversationAssignment"

[[generate]]
kind = "event"
name = "MessageReceived"
fields = ["id:uuid", "workspaceId:uuid", "conversationId:uuid", "occurredAt:instant"]

[[generate]]
kind = "usecase"
name = "ReceiveMessage"
fields = ["id:uuid", "workspaceId:uuid@scope", "conversationId:uuid", "direction:MessageDirection", "body:text!"]
on = "Message"
yields = "MessageReceived"

[[generate]]
kind = "http-sink"
name = "Provider"
on = "ReceiveMessage"
yields = "MessageReceived"

[[generate]]
kind = "query"
name = "ContactsByWorkspace"
fields = ["workspaceId:uuid@scope"]
on = "Contact"

[[generate]]
kind = "query"
name = "MembersByWorkspace"
fields = ["workspaceId:uuid@scope"]
on = "Member"

[[generate]]
kind = "query"
name = "InboxesByWorkspace"
fields = ["workspaceId:uuid@scope"]
on = "Inbox"

[[generate]]
kind = "query"
name = "InboxMembersByInbox"
fields = ["workspaceId:uuid@scope", "inboxId:uuid"]
on = "InboxMember"

[[generate]]
kind = "query"
name = "ConversationsByWorkspace"
fields = ["workspaceId:uuid@scope"]
on = "Conversation"

[[generate]]
kind = "query"
name = "MessagesByConversation"
fields = ["workspaceId:uuid@scope", "conversationId:uuid"]
on = "Message"

[[generate]]
kind = "query"
name = "AssignmentByConversation"
fields = ["workspaceId:uuid@scope", "conversationId:uuid"]
on = "ConversationAssignment"

[[generate]]
kind = "transition"
name = "ChangeConversationStatus"
fields = ["id:uuid", "workspaceId:uuid@scope", "status:ConversationStatus", "version:long@nonnegative"]
on = "Conversation"

[[generate]]
kind = "transition"
name = "ReassignConversation"
fields = ["id:uuid", "workspaceId:uuid@scope", "memberId:uuid", "status:AssignmentStatus", "version:long@nonnegative"]
on = "ConversationAssignment"
