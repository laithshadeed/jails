# An Intercom-shaped support inbox expressed with the same generic intents.
schema = 1
capabilities = ["db", "api", "actuator", "observability", "security", "json", "testkit", "kafka", "docker", "ci"]

[[generate]]
kind = "enum"
name = "ConversationStatus"
fields = ["OPEN", "PENDING", "CLOSED"]

[[generate]]
kind = "enum"
name = "MessageDirection"
fields = ["INBOUND", "OUTBOUND"]

[[generate]]
kind = "scaffold"
name = "Workspace"
fields = ["id:uuid@pk@scope", "name:string!@unique", "createdAt:instant"]

[[generate]]
kind = "scaffold"
name = "Contact"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "email:string!", "displayName:string?", "createdAt:instant"]
indexes = ["workspace_id, email"]

[[generate]]
kind = "scaffold"
name = "Conversation"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "contactId:uuid@index", "status:ConversationStatus@index", "lastMessageAt:instant", "version:long@nonnegative"]
indexes = ["workspace_id, status, last_message_at desc"]

[[generate]]
kind = "scaffold"
name = "Message"
fields = ["id:uuid@pk", "workspaceId:uuid@index@scope", "conversationId:uuid@index", "direction:MessageDirection", "body:text!", "createdAt:instant"]
indexes = ["conversation_id, created_at"]

[[generate]]
kind = "usecase"
name = "CreateWorkspace"
fields = ["id:uuid@scope", "name:string!"]
strategy_on = "Workspace"

[[generate]]
kind = "usecase"
name = "CreateContact"
fields = ["id:uuid", "workspaceId:uuid@scope", "email:string!", "displayName:string?"]
strategy_on = "Contact"

[[generate]]
kind = "usecase"
name = "OpenConversation"
fields = ["id:uuid", "workspaceId:uuid@scope", "contactId:uuid"]
strategy_on = "Conversation"

[[generate]]
kind = "event"
name = "MessageReceived"
fields = ["id:uuid", "workspaceId:uuid", "conversationId:uuid", "occurredAt:instant"]

[[generate]]
kind = "usecase"
name = "ReceiveMessage"
fields = ["id:uuid", "workspaceId:uuid@scope", "conversationId:uuid", "direction:MessageDirection", "body:text!"]
strategy_on = "Message"
strategy_yields = "MessageReceived"

[[generate]]
kind = "query"
name = "ContactsByWorkspace"
fields = ["workspaceId:uuid@scope"]
strategy_on = "Contact"

[[generate]]
kind = "query"
name = "ConversationsByWorkspace"
fields = ["workspaceId:uuid@scope"]
strategy_on = "Conversation"

[[generate]]
kind = "query"
name = "MessagesByConversation"
fields = ["workspaceId:uuid@scope", "conversationId:uuid"]
strategy_on = "Message"

[[generate]]
kind = "transition"
name = "ChangeConversationStatus"
fields = ["id:uuid", "workspaceId:uuid@scope", "status:ConversationStatus", "version:long@nonnegative"]
strategy_on = "Conversation"

[[generate]]
kind = "durable-job"
name = "OutboundDelivery"
fields = ["id:uuid", "workspaceId:uuid@scope", "conversationId:uuid", "direction:MessageDirection", "body:text!"]
strategy_on = "ReceiveMessage"
strategy_yields = "Message"
