# Minicom, ported from Rails and Django to Spring.
#
# The Rails app (app/models, config/routes.rb) and the Django app
# (minicom/models.py, minicom/urls.py) are the same domain expressed twice:
# a user identified by email, messages that belong to them, a read flag, a
# timestamp, and a direction. Neither framework appears below, and neither
# does "minicom" -- these are the same generic intents the crawler and the
# support inbox are built from.
schema = 1
capabilities = ["db", "api", "cors", "json", "testkit"]

# `direction = models.TextField(default='TO_USER')  # or FROM_USER` in Django,
# a bare string column in Rails. A closed set is what it always was; saying so
# lets jails generate the sample values its tests need.
[[generate]]
kind = "enum"
name = "MessageDirection"
fields = ["TO_USER", "FROM_USER"]

[[generate]]
kind = "scaffold"
name = "User"
fields = ["id:long@pk", "email:string!@unique"]
timestamps = true

[[generate]]
kind = "scaffold"
name = "Message"
fields = ["id:long@pk", "userId:long@index", "body:string!", "isRead:boolean", "timeStamp:instant@index", "direction:MessageDirection", "version:long@nonnegative"]
timestamps = true
indexes = ["user_id, time_stamp desc"]

# `user = models.ForeignKey(User)` / `t.index ["user_id"]`, enforced in
# PostgreSQL rather than trusted from the caller.
[[generate]]
kind = "association"
name = "MessageUser"
fields = ["userId=id"]
on = "Message"
yields = "User"

# POST /api/send
#
# No `id`: `Message.id` is `long@pk`, so PostgreSQL assigns it and the create
# returns the row it wrote. Naming it here used to be accepted and then
# silently dropped by the insert.
[[generate]]
kind = "usecase"
name = "SendMessage"
fields = ["userId:long", "body:string!", "direction:MessageDirection"]
on = "Message"

# POST /api/read  ->  Message.mark_read()
#
# `version` is jails asking for something neither framework had: Django's
# `save()` and Rails' `update` last-write-wins, so two readers marking the
# same message read at once silently lose one update. A transition refuses
# without it.
[[generate]]
kind = "transition"
name = "MarkAsRead"
fields = ["id:long", "isRead:boolean", "version:long@nonnegative"]
on = "Message"

# POST /api/conversation  ->  User.all_messages()
[[generate]]
kind = "query"
name = "Conversation"
fields = ["userId:long"]
on = "Message"

# POST /customer_api/ping {email} — the whole customer-facing surface of the
# Django original, and the one endpoint jails could not express: `Message` has
# no `email` component, so a query on it was reachable only by a caller that
# already knew the surrogate user id. `--via User` reads `users` alongside
# `messages`, joined on the `userId` the scaffold already declares.
# `order_by` and `limit` are the Django `[:20]` and `-created_at` the original
# applied in the view. The adapter picked both silently before: newest first by
# whichever timestamp it found, 100 rows, neither sayable and neither reported.
[[generate]]
kind = "query"
name = "UnreadForEmail"
fields = ["email:string!", "isRead:boolean"]
on = "Message"
via = "User"
order_by = "timeStamp desc"
limit = 20

# `User.get_or_create_from_email(email)` — the first line of the Django ping
# handler, and of two of the other five ports. `g usecase` always inserted, so
# on a `@unique` column the second call was a constraint violation rather than
# a fetch, and every project hand-wrote the same statement.
[[generate]]
kind = "usecase"
name = "EnsureUser"
fields = ["email:string!"]
on = "User"
on_conflict = "email"

# `consumers.py` tracks admin presence in a module-level dict, under a comment
# saying it works *because* there is one Daphne process. It is correct on one
# node and wrong on two, and nothing reports the difference — so the state goes
# in PostgreSQL and the generated IT asks a second node.
[[generate]]
kind = "presence"
name = "Admin"
