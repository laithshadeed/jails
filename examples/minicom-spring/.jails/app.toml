# `minicom-public/spring`, the Gradle interview scaffold.
#
# Not the same app as `examples/minicom/`, which ports the Rails and Django
# minicom *domain* -- users, messages, read flags -- onto Spring. This is the
# skeleton those interviews start from: two endpoints that answer
# `{"success": true}`, browser access opened up, and an in-process database
# with a console.
#
# It is here because it is the project `jails new --gradle` was built for, and
# because a manifest is the honest way to state how much of a real project
# jails' generic intents cover. Three things in the target are *not* below,
# and none of them can be: `server.port=3000`, an H2 URL under `~`, and a
# `schema.sql` applied by `spring.sql.init.mode=always`. jails' database
# capabilities are forward-only migrations, not a schema script re-applied at
# every start, and a port is one line of reader-owned configuration that no
# capability owns. See README.md.
#
# Create the project this applies to with:
#
#   jails new spring --gradle --boot 2.7.18 --java 21 \
#     --package com.intercom.spring \
#     --jar-name gs-rest-service --jar-version 0.1.0 \
#     --deps web,data-jdbc \
#     --app examples/minicom-spring/.jails/app.toml
schema = 1

# `WebConfig` in the target is `@EnableWebMvc` plus `addMapping("/**")` -- a
# CORS policy with no origin list, which a browser accepts only because the
# scaffold never sends credentials. `add cors` writes the credentialed form
# with explicit origins instead. That is a deliberate difference, not a
# reproduction failure: the permissive one is the shape that stops working
# the first time somebody adds a cookie.
capabilities = ["h2", "cors"]

# What both endpoints answer with. The target returns a bare
# `HashMap<String, Boolean>` from a raw `Map`-typed method; a record is the
# same JSON and is the type the generated tests can be written against.
[[generate]]
kind = "record"
name = "Verification"
fields = ["success:boolean"]

# POST /foo
#
# The target puts these in `com.intercom.spring.controllers` rather than
# jails' conventional `web` layer, and that difference is now a *convention*
# rather than a per-row override: the compiler derives every managed
# destination, so a project that wants the target's name sets `web =
# "controllers"` under `[layout]` in `jails.toml` once and every controller
# follows. A row that named its own package could put two controllers of the
# same resource in two places, which is the thing `jails model explain` exists
# to make impossible.
[[generate]]
kind = "controller"
name = "Foo"
method = "post"
on = "Verification"
yields = "Verification"

# POST /bar
[[generate]]
kind = "controller"
name = "Bar"
method = "post"
on = "Verification"
yields = "Verification"
